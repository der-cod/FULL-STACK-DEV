<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#5c6b7a;--bd:#dde2e8;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--code:#0f172a;--codetx:#e2e8f0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202a;--tx:#e6ebf1;--mu:#98a6b5;--bd:#2a3542;--ac:#60a5fa;--ok:#4ade80;--bad:#f87171;--code:#0b1017;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202a;--tx:#e6ebf1;--mu:#98a6b5;--bd:#2a3542;--ac:#60a5fa;--ok:#4ade80;--bad:#f87171;--code:#0b1017;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.25rem;margin:1.2em 0 .4em}h3{font-size:1rem;margin:1em 0 .3em;color:var(--ac)}
.sub{color:var(--mu);margin:0 0 12px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.stat{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mu);margin:6px 0 12px}
.nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer;text-align:left}
.nav button.on{border-color:var(--ac);outline:2px solid var(--ac)}
.nav small{display:block;color:var(--mu);font-size:.72rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
ul{padding-left:1.2em;margin:.3em 0}li{margin:.25em 0}
pre{background:var(--code);color:var(--codetx);border-radius:10px;padding:12px;overflow-x:auto;font-size:.82rem;line-height:1.5;margin:.5em 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace}
label.t{display:flex;gap:10px;align-items:flex-start;margin:.4em 0;cursor:pointer}
label.t input{margin-top:.35em;width:18px;height:18px}
.q{margin:.8em 0;padding-top:.8em;border-top:1px dashed var(--bd)}
.q button{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--bd);border-radius:9px;background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.q button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.q button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.ex{font-size:.88rem;color:var(--mu);margin:.3em 0}
a{color:var(--ac)}.vid{display:inline-block;margin-top:2px;font-size:.9rem;font-weight:600}
.cn{border-left:3px solid var(--ac);padding:2px 0 2px 12px;margin:14px 0}.cn p{margin:.3em 0}.an{color:var(--mu);font-size:.9rem}
.lay{border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:12px;padding:10px 14px;margin:6px 0;background:var(--card)}.lay b{display:block}.lay span{color:var(--mu);font-size:.88rem}.ar{text-align:center;color:var(--mu);font-size:.8rem}
.tag{display:inline-block;font-size:.72rem;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);padding:2px 8px;border-radius:9px;margin-right:6px}
.case{border-left:4px solid var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{padding:8px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.row button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.86rem}td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left}
</style>

var M=[
{n:"Fondasi Web & Tools",w:"Minggu 1-2",
c:["Cara kerja web: browser (client) meminta halaman ke server lewat HTTP, server membalas HTML/JSON.","HTML semantik: header, main, section, form, button. Penting untuk SEO dan aksesibilitas.","CSS modern: Flexbox, Grid, variabel CSS, media query (responsif ala mobile-first).","Tools wajib: VS Code, terminal dasar, Git dan GitHub (commit, branch, push).","Browser DevTools: inspect elemen, tab Network, Console."],
code:"<main>\n  <h1>Kopi Gerobak</h1>\n  <ul class=\"menu\">\n    <li>Kopi Susu - Rp 12.000</li>\n  </ul>\n</main>\n\n/* style.css */\n.menu{display:grid;gap:8px;\n  grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}",
cs:"Buat halaman statis “Menu Kopi Gerobak” yang responsif di HP: daftar menu, harga, dan tombol WhatsApp pesan. Simpan di GitHub.",
t:["Buat repo GitHub pertama dan commit halaman menu","Susun layout dengan Flexbox dan Grid","Cek tampilan di HP lewat DevTools"],
q:[{q:"Tag HTML paling tepat untuk isi utama halaman?",o:["<div>","<main>","<span>"],a:1,e:"<main> adalah elemen semantik untuk konten utama."},{q:"Perintah Git untuk menyimpan perubahan ke riwayat lokal?",o:["git push","git commit","git clone"],a:1,e:"commit mencatat snapshot; push mengirimnya ke GitHub."}]},
{n:"JavaScript Modern",w:"Minggu 3-5",
c:["Dasar: variabel (const/let), tipe data, fungsi arrow, array dan object.","Method array: map, filter, reduce, find. Inti pengolahan data.","DOM: querySelector, addEventListener, mengubah halaman secara dinamis.","Asinkron: Promise, async/await, fetch() untuk memanggil API.","ES Modules (import/export), optional chaining (?.), destructuring."],
code:"const keranjang=[{nama:'Kopi Susu',harga:12000,qty:2},\n                 {nama:'Americano',harga:10000,qty:1}];\nconst total=keranjang.reduce((s,i)=>s+i.harga*i.qty,0);\nconsole.log(total); // 34000\n\nconst res=await fetch('/api/menu');\nconst menu=await res.json();",
cs:"Halaman kasir sederhana: pilih menu, atur jumlah, total belanja terhitung otomatis, tombol bayar menampilkan kembalian.",
t:["Kuasai map/filter/reduce lewat 10 latihan","Bangun kalkulator kasir dengan DOM","Panggil API publik memakai fetch"],
q:[{q:"Method untuk menjumlahkan semua nilai array?",o:["filter","reduce","find"],a:1,e:"reduce mengakumulasi array menjadi satu nilai."},{q:"Kata kunci untuk menunggu hasil Promise dengan rapi?",o:["await","defer","yield"],a:0,e:"await dipakai di dalam fungsi async."}]},
{n:"TypeScript & Tooling",w:"Minggu 6-7",
c:["TypeScript menambah tipe statis ke JavaScript, mengurangi bug sejak penulisan kode. Kini standar industri.","Tipe dasar: string, number, interface, type, union, generics sederhana.","npm/pnpm, package.json, dan Vite sebagai build tool cepat.","ESLint dan Prettier untuk kode rapi dan konsisten.","Variabel lingkungan (.env) untuk menyimpan rahasia, jangan di-commit."],
code:"interface Produk{ id:number; nama:string; harga:number; stok:number }\n\nfunction hitungTotal(items:{harga:number;qty:number}[]):number{\n  return items.reduce((s,i)=>s+i.harga*i.qty,0);\n}",
cs:"Pindahkan kalkulator kasir ke TypeScript dengan Vite. Definisikan tipe Produk, ItemKeranjang, Transaksi.",
t:["Buat proyek Vite + TypeScript","Definisikan tipe data domain POS","Pasang ESLint dan Prettier"],
q:[{q:"Manfaat utama TypeScript?",o:["Halaman lebih cepat dimuat","Error tipe terdeteksi sebelum dijalankan","Tidak butuh JavaScript"],a:1,e:"TS dikompilasi ke JS; keuntungannya pengecekan tipe saat menulis."},{q:"File .env sebaiknya?",o:["Di-commit ke GitHub","Masuk .gitignore","Dikirim ke browser"],a:1,e:"Berisi rahasia seperti kunci API dan password database."}]},
{n:"React & Next.js",w:"Minggu 8-11",
c:["React: UI dibangun dari komponen. Pelajari props, state (useState), efek (useEffect), dan list rendering.","Next.js (App Router): routing berbasis folder, Server Components, Server Actions, satu framework untuk front end dan back end.","Tailwind CSS untuk styling cepat; komponen siap pakai seperti shadcn/ui.","Form dan validasi dengan React Hook Form + Zod.","Data fetching dan cache; pahami beda Server Component dan Client Component."],
code:"'use client';\nimport { useState } from 'react';\n\nexport default function Keranjang(){\n  const [qty,setQty]=useState(0);\n  return <button onClick={()=>setQty(qty+1)}>Kopi Susu x {qty}</button>;\n}",
cs:"Bangun UI kasir POS di Next.js: halaman /kasir, komponen DaftarMenu, Keranjang, dan Struk. Data masih dummy.",
t:["Ikuti tutorial resmi Next.js dan buat proyek baru","Buat 3 komponen kasir dengan state","Deploy versi awal ke Vercel"],
q:[{q:"Hook React untuk menyimpan data yang berubah di UI?",o:["useState","useRouter","useServer"],a:0,e:"useState menyimpan state lokal komponen."},{q:"Apa keunggulan Next.js?",o:["Hanya untuk database","Menggabungkan routing, rendering server, dan API","Pengganti HTML"],a:1,e:"Next.js full stack framework di atas React."}]},
{n:"Backend: Node.js & REST API",w:"Minggu 12-14",
c:["Node.js menjalankan JavaScript/TypeScript di server. Alternatif ringan: Bun.","Framework: Express, atau Hono/Fastify yang lebih modern.","REST API: GET (baca), POST (buat), PUT/PATCH (ubah), DELETE (hapus); kode status 200, 201, 400, 401, 404, 500.","Validasi input dengan Zod, penanganan error, middleware, CORS.","Dokumentasi API dengan OpenAPI/Swagger; uji dengan Postman atau Bruno."],
code:"import { Hono } from 'hono';\nconst app=new Hono();\n\napp.get('/api/menu',(c)=>c.json([{id:1,nama:'Kopi Susu',harga:12000}]));\napp.post('/api/transaksi',async(c)=>{\n  const body=await c.req.json();\n  return c.json({ok:true,total:body.total},201);\n});\nexport default app;",
cs:"API POS: GET /api/menu, POST /api/transaksi, GET /api/laporan?tanggal=. Hubungkan dengan UI kasir lewat fetch.",
t:["Buat 3 endpoint dengan validasi Zod","Uji semua endpoint di Postman/Bruno","Sambungkan UI kasir ke API"],
q:[{q:"Kode status untuk data baru berhasil dibuat?",o:["200","201","404"],a:1,e:"201 Created, umum dipakai untuk POST sukses."},{q:"Method HTTP untuk membaca data?",o:["GET","POST","DELETE"],a:0,e:"GET tidak mengubah data di server."}]},
{n:"Database & SQL",w:"Minggu 15-17",
c:["PostgreSQL: database relasional paling populer. Layanan gratis: Neon, Supabase.","SQL dasar: SELECT, INSERT, UPDATE, DELETE, WHERE, ORDER BY, GROUP BY.","Relasi: primary key, foreign key, JOIN. Normalisasi sederhana.","ORM modern: Drizzle atau Prisma, plus migrasi skema.","Transaksi database (BEGIN/COMMIT) agar stok dan penjualan selalu konsisten; index untuk kecepatan."],
code:"CREATE TABLE produk(id serial PRIMARY KEY, nama text, harga int, stok int);\nCREATE TABLE transaksi(id serial PRIMARY KEY, waktu timestamptz DEFAULT now(), total int);\nCREATE TABLE item(transaksi_id int REFERENCES transaksi(id),\n                  produk_id int REFERENCES produk(id), qty int);\n\nSELECT p.nama, SUM(i.qty) AS terjual\nFROM item i JOIN produk p ON p.id=i.produk_id\nGROUP BY p.nama ORDER BY terjual DESC;",
cs:"Rancang skema POS: produk, transaksi, item, stok, bahan baku (HPP), karyawan. Buat laporan laba rugi harian dan produk terlaris dengan SQL.",
t:["Buat database Postgres di Neon/Supabase","Latihan 20 query SQL termasuk JOIN","Pasang Drizzle/Prisma dan jalankan migrasi"],
q:[{q:"Kolom yang menunjuk ke tabel lain disebut?",o:["Primary key","Foreign key","Index"],a:1,e:"Foreign key menjaga relasi antar tabel."},{q:"Perintah untuk menggabungkan dua tabel?",o:["JOIN","MERGE UI","UNION CSS"],a:0,e:"JOIN menggabungkan baris berdasarkan kolom terkait."}]},
{n:"Auth, Keamanan & Testing",w:"Minggu 18-19",
c:["Autentikasi (siapa kamu) vs otorisasi (boleh apa). Peran: pemilik, kasir.","Pakai library matang (Auth.js, Better Auth, atau Supabase Auth), jangan buat sendiri. Password wajib di-hash (bcrypt/argon2).","Ancaman umum OWASP: SQL injection, XSS, CSRF, kebocoran rahasia. Gunakan query berparameter dan validasi semua input.","HTTPS, cookie HttpOnly, rate limiting.","Testing: unit test dengan Vitest, uji E2E dengan Playwright."],
code:"// Vitest\nimport { test, expect } from 'vitest';\nimport { hitungTotal } from './kasir';\n\ntest('total benar',()=>{\n  expect(hitungTotal([{harga:12000,qty:2}])).toBe(24000);\n});",
cs:"Tambahkan login dua peran ke POS: pemilik melihat laporan, kasir hanya transaksi. Tulis tes untuk perhitungan total dan stok.",
t:["Pasang login dengan library auth","Batasi halaman laporan hanya untuk pemilik","Tulis 5 unit test"],
q:[{q:"Cara aman menyimpan password?",o:["Teks biasa","Di-hash (argon2/bcrypt)","Di localStorage"],a:1,e:"Hash satu arah, jangan pernah simpan teks asli."},{q:"Mencegah SQL injection paling efektif dengan?",o:["Query berparameter","Menyembunyikan tombol","Menambah CSS"],a:0,e:"Input pengguna tidak pernah digabung langsung ke string SQL."}]},
{n:"Deploy, DevOps & AI",w:"Minggu 20-24",
c:["Deploy: Vercel/Cloudflare untuk front end, Railway/Fly.io/VPS untuk backend. Domain dan HTTPS.","Docker: bungkus aplikasi agar berjalan sama di mana saja. CI/CD dengan GitHub Actions: tes dan deploy otomatis.","Monitoring: log, error tracking (Sentry).","Rekayasa dengan AI: memakai asisten kode (Claude Code) untuk produktivitas, tetap review kode dan pahami hasilnya.","Membangun fitur AI: panggil LLM API dari backend (jangan dari browser), prompt terstruktur, tool use/function calling, RAG, dan MCP untuk menyambungkan data."],
code:"// server: ringkasan penjualan oleh AI\nconst r=await fetch('https://api.anthropic.com/v1/messages',{\n  method:'POST',\n  headers:{'x-api-key':process.env.ANTHROPIC_API_KEY,\n           'anthropic-version':'2023-06-01','content-type':'application/json'},\n  body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:500,\n    messages:[{role:'user',content:'Ringkas penjualan: '+JSON.stringify(data)}]})\n});",

t:["Deploy POS ke domain sendiri","Siapkan GitHub Actions untuk tes dan deploy","Buat fitur asisten AI di backend"],
q:[{q:"Di mana kunci API LLM sebaiknya dipakai?",o:["Di kode browser","Di server, lewat variabel lingkungan","Di README"],a:1,e:"Kunci di browser bisa dicuri siapa saja."},{q:"Fungsi Docker?",o:["Membungkus aplikasi dan dependensinya","Mengedit gambar","Mendesain UI"],a:0,e:"Container membuat lingkungan konsisten dari laptop ke server."}]}
];
var P=[
[["Cara kerja web","Saat Anda membuka alamat situs, browser (client) mengirim permintaan HTTP ke server. Server memproses lalu membalas berupa HTML, CSS, JavaScript, atau data JSON, dan browser menampilkannya. Front end adalah bagian yang berjalan di browser; back end adalah bagian yang berjalan di server.","Seperti restoran: pelanggan (browser) memesan lewat pelayan (HTTP), dapur (server) memasak, lalu pesanan diantar ke meja."],["HTML: kerangka halaman","HTML menyusun isi halaman memakai tag. Tag semantik seperti header, main, nav, dan button memberi tahu browser dan mesin pencari apa fungsi tiap bagian, sehingga halaman lebih mudah diakses dan ditemukan.","Kerangka dan dinding bangunan: menentukan ada apa saja dan di mana."],["CSS: tampilan dan tata letak","CSS mengatur warna, ukuran, jarak, dan posisi. Flexbox menyusun elemen searah (baris atau kolom), Grid menyusun dua arah (baris dan kolom). Media query membuat tampilan menyesuaikan ukuran layar HP atau laptop.","Cat, interior, dan penataan perabot setelah bangunan berdiri."],["Git dan GitHub","Git mencatat riwayat perubahan kode. Commit adalah titik simpan, branch adalah cabang untuk mencoba hal baru tanpa merusak versi utama, dan GitHub adalah tempat menyimpan repositori secara online.","Seperti save game dengan banyak slot: Anda bisa kembali ke titik mana pun jika ada kesalahan."]],
[["Variabel, tipe data, dan fungsi","Variabel adalah wadah bernama untuk menyimpan nilai: const untuk nilai tetap, let untuk nilai yang berubah. Tipe data dasarnya string (teks), number, boolean (benar/salah). Fungsi adalah blok kode bernama yang menerima input (parameter) dan mengembalikan hasil (return).","Variabel seperti toples berlabel; fungsi seperti resep: bahan masuk, masakan jadi keluar."],["Array dan object","Array adalah daftar berurutan, object adalah kumpulan pasangan nama dan nilai. Tiga method penting: map mengubah tiap elemen, filter menyaring elemen, reduce meringkas semuanya jadi satu nilai (misalnya total belanja).","Array seperti daftar belanja, object seperti kartu data pelanggan; map/filter/reduce seperti tahapan di lini produksi."],["DOM dan event","DOM adalah representasi halaman sebagai pohon objek yang bisa diubah oleh JavaScript. Event (klik, ketik, kirim form) memicu fungsi yang Anda tentukan, misalnya menambah item ke keranjang lalu memperbarui tampilan.","Panel kontrol mesin: tombol ditekan (event), mesin bereaksi (fungsi), lampu indikator berubah (DOM)."],["Kode asinkron: Promise dan async/await","Mengambil data dari server butuh waktu. Promise adalah janji hasil yang datang nanti; async/await membuat kode menunggu hasil dengan rapi tanpa membekukan halaman. fetch() adalah cara standar memanggil API.","Memesan kopi lalu mendapat nomor antrean: Anda boleh duduk, dan dipanggil saat pesanan jadi."]],
[["TypeScript: JavaScript dengan tipe","Anda menyatakan jenis data setiap variabel dan fungsi. Kesalahan seperti menjumlah teks dengan angka terdeteksi saat menulis kode, bukan saat aplikasi sudah dipakai pelanggan. Kode TypeScript dikompilasi menjadi JavaScript biasa.","Seperti bentuk colokan listrik: salah pasang langsung ketahuan sebelum menyala."],["Interface dan type","Cetak biru bentuk data: field apa saja dan tipenya. Misalnya Produk punya id, nama, harga, stok. Definisi ini bisa dipakai ulang di front end dan back end agar keduanya sepakat soal bentuk data.","Formulir dengan kolom wajib: data yang tidak sesuai langsung ditolak."],["npm dan package.json","npm mengunduh pustaka (package) buatan orang lain agar Anda tidak menulis semuanya dari nol. File package.json mencatat daftar pustaka beserta versinya dan perintah proyek seperti dev, build, test.","Daftar belanja bahan beserta alamat toko pemasoknya."],["Vite dan file .env","Vite menjalankan dan membangun proyek dengan cepat. File .env menyimpan rahasia seperti kunci API dan password database di luar kode, dan tidak boleh di-commit ke GitHub (masukkan ke .gitignore).","Brankas terpisah dari buku resep: resep boleh dibagikan, kunci brankas tidak."]],
[["Komponen","Komponen adalah potongan UI mandiri yang bisa dipakai ulang, ditulis sebagai fungsi yang mengembalikan JSX (HTML di dalam JavaScript). Halaman adalah susunan komponen: DaftarMenu, Keranjang, Struk.","Balok LEGO: bentuk kecil yang dirakit menjadi bangunan besar."],["Props dan state","Props adalah data yang dikirim komponen induk ke anak (hanya dibaca). State adalah data milik komponen yang bisa berubah; saat state berubah, React otomatis menggambar ulang tampilan yang terkait.","Props seperti pesanan dari kasir ke dapur; state seperti isi keranjang yang terus bertambah."],["Next.js","Framework di atas React. Struktur folder menentukan URL (routing), halaman bisa dirender di server, dan ada backend ringan (Route Handler, Server Actions). Server Component berjalan di server; Client Component berjalan di browser dan bisa interaktif.","React adalah mesinnya, Next.js adalah mobil lengkap yang siap dikendarai."],["Tailwind dan form tervalidasi","Tailwind memberi styling lewat kelas kecil langsung di JSX, tanpa file CSS terpisah. Untuk form, Zod memeriksa bentuk data sehingga input yang salah ditolak sebelum dikirim ke server.","Tailwind seperti stiker siap tempel; Zod seperti satpam yang mengecek tiket di pintu."]],
[["Node.js","Node.js memungkinkan JavaScript berjalan di server, bukan hanya di browser. Dengan begitu Anda memakai satu bahasa untuk front end dan back end. Framework seperti Express atau Hono mempermudah membuat server.","Seperti satu juru masak yang bisa bekerja di dapur depan dan belakang."],["HTTP dan REST API","API adalah pintu komunikasi antara aplikasi. URL menunjuk sumber data (misalnya /api/menu), method menyatakan aksi: GET baca, POST buat, PATCH ubah, DELETE hapus. Respons memuat kode status: 200 berhasil, 201 dibuat, 400 input salah, 401 belum login, 404 tidak ada, 500 error server.","Loket pelayanan: Anda menyebut jenis layanan dan menerima jawaban beserta status."],["JSON dan routing","JSON adalah format teks standar untuk bertukar data antara front end dan back end, berisi pasangan nama dan nilai. Routing menentukan fungsi mana yang menangani URL dan method tertentu.","JSON seperti bahasa isyarat bersama yang dimengerti semua pihak; routing seperti papan penunjuk arah di gedung."],["Middleware dan validasi","Middleware adalah lapisan yang dilalui setiap permintaan sebelum sampai ke fungsi utama: mencatat log, memeriksa login, memvalidasi input. Jangan pernah percaya data dari client; selalu validasi di server.","Pos pemeriksaan sebelum masuk gedung."]],
[["Database relasional","Data disimpan dalam tabel: baris adalah satu catatan, kolom adalah atribut. Tabel saling berhubungan. PostgreSQL adalah pilihan populer, andal, dan gratis, tersedia online lewat Neon atau Supabase.","Spreadsheet dengan banyak sheet yang saling terhubung, tetapi aturannya ketat sehingga data tetap konsisten."],["SQL","Bahasa untuk bertanya dan mengubah data: SELECT membaca, INSERT menambah, UPDATE mengubah, DELETE menghapus. WHERE menyaring, ORDER BY mengurutkan, GROUP BY merangkum (misalnya total penjualan per menu).","Seperti meminta petugas arsip: “tolong ambilkan semua struk bulan ini, urutkan dari yang terbesar”."],["Relasi dan JOIN","Primary key adalah ID unik tiap baris. Foreign key adalah kolom yang menunjuk ke ID tabel lain. JOIN menyatukan data dari dua tabel. Menyimpan data sekali dan menautkannya disebut normalisasi, agar tidak ada salinan ganda yang bisa berbeda.","Struk hanya mencatat nomor produk; nama dan harga dilihat di daftar menu, tidak ditulis ulang tiap transaksi."],["Transaksi dan ORM","Transaksi database membungkus beberapa operasi menjadi satu paket: semua berhasil atau semuanya dibatalkan. ORM (Drizzle, Prisma) memungkinkan Anda bekerja dengan tabel sebagai objek TypeScript dan mengelola perubahan skema lewat migrasi.","Transfer bank: saldo pengirim berkurang dan saldo penerima bertambah harus terjadi bersamaan."]],
[["Autentikasi dan otorisasi","Autentikasi memastikan siapa Anda (login). Otorisasi menentukan apa yang boleh Anda lakukan (peran). Contoh POS: kasir hanya boleh transaksi, pemilik boleh melihat laporan laba rugi.","Kartu identitas di pintu masuk (autentikasi) dan kartu akses yang hanya membuka ruangan tertentu (otorisasi)."],["Password, sesi, dan cookie","Password tidak disimpan asli, melainkan di-hash (diubah satu arah) dengan argon2 atau bcrypt. Setelah login, server memberi sesi atau token yang disimpan di cookie HttpOnly. Gunakan library mapan seperti Auth.js, Better Auth, atau Supabase Auth.","Gelang acara: setelah dicek sekali di pintu, Anda cukup menunjukkan gelang."],["Ancaman keamanan umum","SQL injection: input berbahaya disisipkan ke query, dicegah dengan query berparameter. XSS: skrip jahat tampil di halaman, dicegah dengan escape output. Rahasia bocor: jangan masukkan kunci ke kode front end atau repo publik. Selalu pakai HTTPS.","Seperti mengunci pintu, jendela, dan brankas: satu celah cukup bagi pencuri."],["Testing otomatis","Unit test memeriksa fungsi kecil (misalnya hitungTotal) dengan Vitest. Tes end-to-end dengan Playwright menjalankan browser sungguhan untuk mengecek alur penuh seperti login lalu bayar. Tes mencegah perbaikan baru merusak fitur lama.","Pemeriksaan kualitas sebelum barang keluar pabrik."]],
[["Deploy dan domain","Deploy berarti menaruh aplikasi di server publik agar bisa diakses lewat internet. Front end mudah di Vercel atau Cloudflare; backend dan database bisa di Railway, Fly.io, atau VPS. Domain adalah alamat yang mudah diingat, HTTPS mengamankan koneksi.","Membuka kios di pasar: barang jadi sudah ada, sekarang perlu lapak dan alamat."],["Docker dan CI/CD","Docker membungkus aplikasi beserta lingkungannya dalam container sehingga berjalan sama di laptop dan di server. CI/CD (GitHub Actions) menjalankan tes dan deploy otomatis setiap kali kode di-push.","Container seperti kotak bekal lengkap; CI/CD seperti ban berjalan yang memeriksa lalu mengirim produk sendiri."],["Rekayasa dengan bantuan AI","Asisten kode seperti Claude Code mempercepat penulisan, debugging, dan penjelasan kode. Namun Anda tetap harus membaca, memahami, dan mengetes hasilnya; pondasi dari modul 1 sampai 7 yang membuat Anda bisa menilai apakah hasil AI benar.","AI adalah asisten tukang yang cepat; Anda tetap arsitek yang memeriksa hasil kerjanya."],["Membangun fitur AI","Aplikasi memanggil LLM API dari backend (kunci tidak boleh di browser). Prompt terstruktur dan data dari database dikirim sebagai konteks (RAG). Tool use memungkinkan model memanggil fungsi aplikasi Anda, dan MCP adalah standar untuk menyambungkan model ke sumber data atau alat.","Seperti menanyai staf pintar yang kita beri akses ke buku laporan: jawabannya hanya sebaik data yang kita berikan."]]
];
function MAP(){var L=[['🖥️ Lapisan 1: Front end (berjalan di browser kasir)','HTML = isi dan struktur · CSS = tampilan · JavaScript/TypeScript = perilaku · React/Next.js = kerangka kerja agar UI mudah disusun'],['⚙️ Lapisan 2: Back end (berjalan di server)','TypeScript di Node.js (atau Python, Go, Java, PHP, C#) = aturan bisnis: hitung total, cek login, validasi, kurangi stok. Memakai gaya komunikasi REST API dengan data JSON'],['🗄️ Lapisan 3: Database','SQL di PostgreSQL = penyimpanan permanen: produk, transaksi, stok, pengguna'],['🚀 Lapisan 4: Infrastruktur & otomasi','Dockerfile, YAML (GitHub Actions), Bash = membungkus, menguji, dan merilis aplikasi ke server']];
var h='<div class="card"><span class="tag">Mulai di sini</span><h2 style="margin-top:.3em">🗺️ Peta Bahasa: satu aplikasi, banyak lapisan</h2><p>Aplikasi nyata tidak ditulis dalam satu bahasa. Setiap lapisan punya tugas dan tempat menjalankan yang berbeda, sehingga bahasanya pun berbeda. Contoh di bawah adalah aplikasi POS kopi gerobak yang sudah berjalan penuh.</p>';
h+=L.map(function(x,i){return '<div class="lay"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'+(i<3?'<div class="ar">▲ ▼ saling berkomunikasi</div>':'')}).join('')+'</div>';
h+='<div class="card"><h3 style="margin-top:0">🔄 Satu klik “Bayar”, apa yang terjadi?</h3><ol><li><b>HTML/CSS</b> menampilkan tombol Bayar dan keranjang.</li><li><b>JavaScript/TypeScript</b> di browser menangkap klik, lalu mengirim data lewat fetch().</li><li>Data dikirim dalam format <b>JSON</b> melalui jaringan (HTTP) ke server.</li><li><b>Back end (TypeScript/Node.js)</b> memeriksa login, memvalidasi data, menghitung ulang total.</li><li><b>SQL</b> menyimpan transaksi dan mengurangi stok dalam satu transaksi database.</li><li>Server membalas JSON “berhasil”, dan <b>JavaScript</b> memperbarui tampilan serta mencetak struk.</li></ol></div>';
h+='<div class="card"><h3 style="margin-top:0">📋 Siapa mengerjakan apa, dan mengapa dibedakan</h3><div class="tbl"><table><tr><th>Bahasa</th><th>Tugas</th><th>Mengapa terpisah</th></tr><tr><td>HTML</td><td>Struktur isi halaman</td><td>Browser hanya mengerti HTML untuk membentuk halaman</td></tr><tr><td>CSS</td><td>Tampilan dan tata letak</td><td>Memisahkan isi dari gaya agar desain bisa diganti tanpa menyentuh isi</td></tr><tr><td>JavaScript / TypeScript</td><td>Logika interaktif di browser; juga bisa di server (Node.js)</td><td>Satu-satunya bahasa pemrograman yang berjalan langsung di browser</td></tr><tr><td>SQL</td><td>Bertanya dan mengubah data</td><td>Dirancang khusus untuk data berbentuk tabel dan jauh lebih efisien daripada menulisnya sendiri</td></tr><tr><td>JSON</td><td>Format bertukar data</td><td>Teks ringan yang dimengerti semua bahasa</td></tr><tr><td>YAML / Dockerfile / Bash</td><td>Konfigurasi, rilis, otomasi</td><td>Mengatur lingkungan server, bukan logika aplikasi</td></tr></table></div></div>';
h+='<div class="card"><h3 style="margin-top:0">🔀 Pilihan bahasa untuk back end</h3><p>Browser memaksa front end memakai HTML/CSS/JavaScript. Back end bebas, sehingga banyak pilihan:</p><ul><li><b>TypeScript (Node.js/Bun):</b> satu bahasa dari front end sampai back end. Paling praktis untuk pemula.</li><li><b>Python:</b> unggul untuk data, otomasi, dan AI. Cocok jika Anda ingin analisis data atau machine learning.</li><li><b>Java/Kotlin, C# (.NET):</b> banyak dipakai di perusahaan besar dan sistem berskala besar.</li><li><b>Go:</b> cepat dan ringan, populer untuk layanan berkinerja tinggi.</li><li><b>PHP:</b> mesin di balik WordPress dan Laravel; masih sangat banyak lowongannya.</li></ul><p><b>Saran:</b> pilih satu jalur dulu. Roadmap ini memakai <b>TypeScript end-to-end + PostgreSQL</b> karena hanya perlu mempelajari satu bahasa pemrograman utama plus SQL. Setelah paham pondasinya, pindah ke bahasa lain jauh lebih mudah karena konsepnya sama.</p></div>';
return h}

function stats(){var tot=0,d=0,qt=0,qc=0;M.forEach(function(m,i){m.t.forEach(function(_,j){tot++;if(S.t[i+"-"+j])d++});m.q.forEach(function(_,j){qt++;if(S.q[i+"-"+j]===1)qc++})});
var p=Math.round(d/tot*100);document.getElementById("pb").style.width=p+"%";document.getElementById("ps").textContent=p+"% selesai ("+d+"/"+tot+" tugas)";document.getElementById("qs").textContent="Kuis: "+qc+"/"+qt+" benar"}
function nav(){document.getElementById("nav").innerHTML='<button class="'+(cur<0?"on":"")+'" data-i="-1">🗺️ Peta Bahasa<small>Mulai di sini</small></button>'+M.map(function(m,i){var d=m.t.filter(function(_,j){return S.t[i+"-"+j]}).length;return '<button class="'+(i===cur?"on":"")+'" data-i="'+i+'">'+(i+1)+'. '+m.n+'<small>'+m.w+' · '+d+'/'+m.t.length+(d===m.t.length?" ✅":"")+'</small></button>'}).join("")}

h+='<div class="row">'+(cur>0?'<button id="pv">← Sebelumnya</button>':"")+(cur<M.length-1?'<button class="p" id="nx">Modul berikutnya →</button>':"")+'</div>';
document.getElementById("main").innerHTML=h;nav();stats()}
